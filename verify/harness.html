<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>scanner harness</title>
  </head>
  <body>
    <!-- The controls live in plain DOM, outside React, on purpose: a scanner that throws from its
         effect cleanup takes the React root down with it, and the harness still has to be able to
         drive the next step to see what happened. -->
    <div style="position: fixed; top: 0; left: 0; z-index: 99999">
      <button id="open" onclick="window.dispatchEvent(new Event('harness:open'))">open</button>
      <button id="close" onclick="window.dispatchEvent(new Event('harness:close'))">close</button>
    </div>
    <div id="root"></div>
    <script type="module" src="./harness.tsx"></script>
  </body>
</html>
